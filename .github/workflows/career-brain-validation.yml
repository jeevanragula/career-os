name: Career Brain Validation

on:
  push:
    paths:
      - "career-profile/**"
      - "scripts/validate_career_profile.py"
      - ".github/workflows/career-brain-validation.yml"
  pull_request:
    paths:
      - "career-profile/**"
      - "scripts/validate_career_profile.py"
      - ".github/workflows/career-brain-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Career Brain
        run: python scripts/validate_career_profile.py
