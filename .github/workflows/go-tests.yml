name: Go Tests

on:
  push:
    paths:
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/go-tests.yml"
  pull_request:
    paths:
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/go-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Resolve modules
        run: go mod tidy
      - name: Run tests
        run: go test ./...
