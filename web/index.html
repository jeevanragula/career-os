<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareerOS</title>
<style>body{font-family:system-ui;margin:0;background:#f6f7f9;color:#17202a}header{padding:24px;background:#111827;color:white}main{max-width:1100px;margin:24px auto;padding:0 16px}.card{background:white;border:1px solid #ddd;border-radius:12px;padding:18px;margin-bottom:18px}input,select,button{padding:10px;border:1px solid #ccc;border-radius:8px;margin:4px}button{cursor:pointer}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee}.muted{color:#667085}.row{display:flex;flex-wrap:wrap;gap:8px}</style></head>
<body><header><h1>CareerOS</h1><div>Evidence-first job search workspace</div></header><main>
<div class="card"><h2>Discover jobs</h2><div class="row">
<select id="provider"><option value="lever">Lever</option><option value="ashby">Ashby</option></select>
<input id="name" placeholder="Company / board name"><input id="base" size="55" placeholder="Public API URL">
<input id="keywords" size="40" placeholder="keywords, e.g. principal,kubernetes,security"><button onclick="discover()">Discover</button></div>
<p class="muted">Use a documented public job-posting URL. For Lever, enter the company site name and its public postings base; for Ashby, enter the public job-board API URL.</p><pre id="discoverResult"></pre></div>
<div class="card"><h2>Jobs</h2><button onclick="loadJobs()">Refresh</button><table><thead><tr><th>Company</th><th>Title</th><th>Location</th><th>Status</th><th>Actions</th></tr></thead><tbody id="jobs"></tbody></table></div>
<div class="card"><h2>Generated resume</h2><textarea id="resumeOut" style="width:100%;min-height:420px"></textarea><p><button onclick="prepare()">Prepare application for last resume</button></p><pre id="applicationResult"></pre></div></main><script>
async function discover(){const body={provider:provider.value,name:name.value,base_url:base.value,keywords:keywords.value.split(',').map(x=>x.trim()).filter(Boolean)};const r=await fetch('/api/discover',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});discoverResult.textContent=await r.text();loadJobs()}
async function loadJobs(){const r=await fetch('/api/jobs');const data=await r.json();jobs.innerHTML=data.map(j=>'<tr><td>'+esc(j.Company)+'</td><td>'+esc(j.Title)+'</td><td>'+esc(j.Location)+'</td><td>'+esc(j.Status)+'</td><td><button data-a="'+j.ID+'">Analyze</button><button data-r="'+j.ID+'">Resume</button></td></tr>').join('');document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>analyze(b.dataset.a));document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>resume(b.dataset.r))}
async function analyze(id){const r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_id:id})});alert(await r.text())}
let lastJob="",lastResume="";async function resume(id){lastJob=id;const r=await fetch("/api/resume",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({job_id:id})});const d=await r.json();if(d.content){lastResume=d.variant_id;resumeOut.value=d.content}else alert(JSON.stringify(d))}async function prepare(){if(!lastJob||!lastResume){alert("Generate a resume first");return}const r=await fetch("/api/applications",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({job_id:lastJob,resume_variant_id:lastResume})});applicationResult.textContent=await r.text()}function esc(x){return String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}loadJobs()
</script></body></html>
